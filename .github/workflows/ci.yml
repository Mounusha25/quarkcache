name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp-core:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizers: ON
          - os: macos-latest
            sanitizers: OFF
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S cpp_core -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DQUARKCACHE_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test core and TCP protocol
        run: ctest --test-dir build --output-on-failure

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build C++ server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpp
          push: false
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
